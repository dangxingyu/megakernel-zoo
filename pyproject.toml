[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "megakernel-zoo"
version = "0.1.0"
description = "Model-specific megakernel inference engines for LLM decoding, with an OpenAI-compatible server"
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.10"
authors = [{ name = "Xingyu Dang" }]
keywords = ["llm", "inference", "cuda", "megakernel", "gpu"]
classifiers = [
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Environment :: GPU :: NVIDIA CUDA",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "torch",
    "numpy",
    "safetensors",
    "tokenizers",
    "aiohttp",
    "jinja2",
    "huggingface_hub",
]

[project.optional-dependencies]
eval = ["transformers", "accelerate", "nvidia-ml-py", "pytest"]

[project.urls]
Homepage = "https://dangxingyu.github.io/megakernel-dashboard/"
Repository = "https://github.com/dangxingyu/megakernel-zoo"

[project.scripts]
mkserve = "mkserve.__main__:main"

# The engines live next to the package (engines/), so install from a checkout: pip install -e .
[tool.setuptools]
packages = ["mkserve"]

[tool.setuptools.package-data]
mkserve = ["registry.json", "README.md"]
